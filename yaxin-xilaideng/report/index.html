<script>
(function(){

function overview(){

  var tLo=Math.round(rm.pingLo*rm.avg), tHi=Math.round(rm.pingHi*rm.avg);
  var recent=R.n1>0?'近一年本社區成交 '+R.n1+' 筆，均價 '+f1(R.avg1)+' 萬／坪。':'最新成交為 '+ymd(R.to)+'，近一年本社區無成交資料。';

      '<div class="kpi gold"><div class="t">同格局'+(PRE?'預售':'歷史')+'成交均價</div><div class="v">'+f1(rm.avg)+'<small>萬／坪</small></div><div class="n">'+rm.label+'樣本 '+rm.n+' 筆</div></div>'+
      '<div class="kpi"><div class="t">同格局最高單價</div><div class="v">'+f1(rm.max)+'<small>萬／坪</small></div><div class="n">目前樣本最高值</div></div>'+

      '<div class="kpi"><div class="t">同格局最低單價</div><div class="v">'+f1(rm.min)+'<small>萬／坪</small></div><div class="n">目前樣本最低值</div></div>'+
    '</div>'+

  var est=head('ESTIMATE',estName+'（'+rm.label+'）',PRE?'本社區預售成交單價的中間六成（20–80 百分位），未做時間換算。預售價含建商定價與付款條件，交屋後的中古成交可能不同。':'把本社區每筆中古成交依區域季指數換算到今天的價格水位，取中間六成（20–80 百分位）。')+

function rangeBar(lo,mid,hi){
  var span=Math.max(hi-lo,.1), pad=span*.6, a=lo-pad, b=hi+pad, pos=function(v){return ((v-a)/(b-a)*100).toFixed(1)+"%"};

    '<div class="lab"><span>低 '+f1(lo)+'</span><span>中位 <b>'+f1(mid)+'</b></span><span>高 '+f1(hi)+'</span></div></div>';
}

function market(){
  var ch=head('TREND','單價走勢','本社區每半年成交中位單價，對照'+(PRE?'同區預售大樓':'同區、同類型、屋齡相近大樓')+'（'+e(cmpLabel)+'）的每季中位單價；單季不到 10 筆的季不畫。')+
    '<div class="legend"><span style="--c:var(--gold)">'+e(R.name)+'（半年）</span><span style="--c:#8fa3c7">比較基準（每季）</span></div>'+chart()+
    '<p class="muted" style="font-size:12.5px;margin:6px 0 0">圓點越大代表該半年成交筆數越多；只有 1–2 筆的半年，單價容易受樓層與格局影響。走勢畫到最後一個資料完整的季（'+D.qFull+'）。</p>';

  var byRoom=head('BY LAYOUT','各格局成交整理')+'<div class="scroll"><table class="t"><thead><tr><th>格局</th><th class="r">筆數</th><th class="r">坪數</th><th class="r">均價</th><th class="r">最低</th><th class="r">最高</th><th class="r">'+(PRE?'預售區間':'今日行情')+'</th><th>最近成交</th></tr></thead><tbody>'+
    R.rooms.map(function(r){return '<tr><td><b>'+r.label+'</b></td><td class="r">'+r.n+'</td><td class="r">'+f1(r.pingLo)+(r.pingLo===r.pingHi?'':'–'+f1(r.pingHi))+'</td><td class="r">'+f1(r.avg)+'</td><td class="r">'+f1(r.min)+'</td><td class="r">'+f1(r.max)+'</td><td class="r">'+f1(r.estLo)+'–'+f1(r.estHi)+'</td><td>'+ymd(r.last)+'</td></tr>'}).join("")+
    '</tbody></table></div><p class="muted" style="font-size:12.5px;margin:8px 0 0">單位：萬／坪（已扣除車位價與車位面積）。</p>';

  var nb=R.nbrs.length?head('COMPARE',nbTitle+'比較',PRE?'同區近一年成交最多的其他預售建案。':nbNear?'同一條路上的其他大樓（依門牌列示）。':'同路段的其他大樓優先，不足時補上'+e(cmpLabel)+'、近一年有成交的大樓（依門牌列示，不一定在附近，僅供同類產品價位參考）。')+
    '<div class="scroll"><table class="t"><thead><tr><th>社區門牌</th><th class="r">完工</th><th class="r">樓高</th><th class="r">近一年</th><th class="r">一年均價</th><th class="r">歷史均價</th></tr></thead><tbody>'+
    '<tr style="background:#fdf8ea"><td><b>'+e(R.name)+'</b>（本案）</td><td class="r">'+builtTxt+'</td><td class="r">'+R.floors+'F</td><td class="r">'+R.n1+' 筆</td><td class="r">'+f1(R.avg1)+'</td><td class="r">'+f1(R.avg)+'</td></tr>'+
    R.nbrs.map(function(x){return '<tr><td>'+e(x.addr)+(x.same?'<span class="tag-same">同路段</span>':'')+'</td><td class="r">'+x.built+'</td><td class="r">'+x.floors+'F</td><td class="r">'+x.n1+' 筆</td><td class="r">'+f1(x.avg1)+'</td><td class="r">'+f1(x.avg)+'</td></tr>'}).join("")+
    '</tbody></table></div>':"";

  var opts='<option value="all">全部格局</option>'+R.rooms.map(function(r){return '<option value="'+r.label+'">'+r.label+'</option>'}).join("");
  var tx=head('RECORDS','成交明細','共 '+R.tx.length+' 筆'+(R.nPre&&R.nResale?'（中古 '+R.nResale+'、預售 '+R.nPre+'）':'')+'，依成交日期由新到舊。')+
    '<label class="muted" style="font-size:13px">篩選 <select id="txf" style="font:inherit;padding:4px 8px;border-radius:8px;border:1px solid var(--line)">'+opts+'</select></label>'+
    '<div class="scroll" style="margin-top:8px"><table class="t"><thead><tr><th>成交日</th><th>類別</th><th class="r">樓層</th><th>格局</th><th class="r">坪數</th><th class="r">總價(萬)</th><th class="r">車位(萬)</th><th class="r">單價</th></tr></thead><tbody id="txb"></tbody></table></div>'+
    '<div id="txmore"></div>';

  return card(ch)+card(byRoom)+(nb?card(nb):"")+card(tx);
}
var txShown=30;
function drawTx(){
  var list=R.tx.filter(function(t){if(txRoom==="all")return true;var k=parseInt(t.rm,10);var lab=k===0?"開放式":k>=4?"4房以上":k+"房";return lab===txRoom});
  document.getElementById("txb").innerHTML=list.slice(0,txShown).map(function(t){return '<tr><td>'+ymd(t.d)+'</td><td>'+(t.src==="預售"?'<span class="tag-same">預售</span>':'中古')+'</td><td class="r">'+(t.f==null?"—":t.f+"F")+'</td><td>'+t.rm+'</td><td class="r">'+f1(t.ping)+'</td><td class="r">'+n0(t.total)+'</td><td class="r">'+(t.parkP?n0(t.parkP):(t.park?"含":"—"))+'</td><td class="r"><b>'+f1(t.unit)+'</b></td></tr>'}).join("");
  document.getElementById("txmore").innerHTML=list.length>txShown?'<p style="text-align:center;margin:12px 0 0"><button class="chip" id="txm">顯示更多（還有 '+(list.length-txShown)+' 筆）</button></p>':'';
  var b=document.getElementById("txm"); if(b)b.onclick=function(){txShown+=50;drawTx()};
}
function chart(){
  var qs=D.rep.trend.qs, dist=D.rep.trend.dist, W=720,H=280,L=44,Rr=12,T=14,B=34;
  var pts=R.trend.comm.map(function(c){var y=+c[0].slice(0,4),h=c[0].slice(4)==="H1"?1:2;var qi=qs.indexOf(y+"Q"+(h*2));var x=qi<0?(qs.indexOf(y+"Q"+(h*2-1))+.5):qi-.5;return {x:x,v:c[1],n:c[2],k:c[0]}}).filter(function(p){return p.x>=0});
  var vals=dist.filter(function(v){return v!=null}).concat(pts.map(function(p){return p.v}));
  var lo=Math.floor(Math.min.apply(null,vals)/5)*5, hi=Math.ceil(Math.max.apply(null,vals)/5)*5; if(hi===lo)hi+=5;
  var X=function(i){return L+(W-L-Rr)*i/(qs.length-1)}, Y=function(v){return T+(H-T-B)*(1-(v-lo)/(hi-lo))};
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="單價走勢圖">';
  for(var g=lo;g<=hi;g+=(hi-lo>20?10:5)){s+='<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+Y(g)+'" y2="'+Y(g)+'" stroke="#ece6d9"/><text x="'+(L-8)+'" y="'+(Y(g)+4)+'" text-anchor="end" font-size="11" fill="#8a8f98">'+g+'</text>'}
  qs.forEach(function(q,i){if(q.slice(4)==="Q1")s+='<text x="'+X(i)+'" y="'+(H-12)+'" text-anchor="middle" font-size="11" fill="#8a8f98">'+q.slice(0,4)+'</text>'});
  var d="";dist.forEach(function(v,i){if(v==null)return;d+=(d?"L":"M")+X(i).toFixed(1)+","+Y(v).toFixed(1)});
  s+='<path d="'+d+'" fill="none" stroke="#8fa3c7" stroke-width="2"/>';
  if(pts.length>1){var p2="";pts.forEach(function(p){p2+=(p2?"L":"M")+X(p.x).toFixed(1)+","+Y(p.v).toFixed(1)});s+='<path d="'+p2+'" fill="none" stroke="#c9a84c" stroke-width="2.5"/>'}
  pts.forEach(function(p){var r=Math.min(9,3.5+Math.sqrt(p.n)*1.2);s+='<circle cx="'+X(p.x).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="'+r.toFixed(1)+'" fill="#c9a84c" stroke="#fff" stroke-width="1.5"><title>'+p.k+'：'+f1(p.v)+' 萬／坪（'+p.n+' 筆）</title></circle>'});
  return s+'</svg>';
}

// ===== 3 環境與生活 =====
function life(){
  var a=G.amenities||{}, groups=G.amenitiesFlat?[["生活機能",G.amenitiesFlat]]:[["商圈購物",a.commercial],["超市量販",a.supermarket],["傳統市場",a.traditionalMarket],["醫療",a.medical],["休閒公園",a.leisure]];
  var am=groups.filter(function(x){return x[1]&&x[1].length}).map(function(x){return '<div class="sub-h">'+x[0]+'</div>'+ul(x[1])}).join("");
  var sc=G.schools&&G.schools.length?'<div class="scroll"><table class="t"><thead><tr><th>學制</th><th>學校</th><th>距離</th></tr></thead><tbody>'+G.schools.map(function(s){return '<tr><td>'+e(s.level)+'</td><td>'+e(s.name)+(s.note?'<div class="muted" style="font-size:12.5px">'+e(s.note)+'</div>':'')+'</td><td>'+e(s.distance)+'</td></tr>'}).join("")+'</tbody></table></div><p class="muted" style="font-size:12.5px;margin:8px 0 0">實際學區以戶籍地址向區公所、學校確認為準。</p>':'';
  var out="";
  if(G.transport.length)out+=card(head('LOCATION','交通與位置')+ul(G.transport));
  var right="";
  if(am)right+=card(head('LIFESTYLE','生活機能')+am);
  var left="";
  if(sc)left+=card(head('SCHOOL','鄰近學區')+sc);
  if(G.sun.length)left+=card(head('DAYLIGHT','採光與座向')+ul(G.sun));
  if(!out&&!left&&!right)return card('<p class="muted">此社區尚未整理生活機能資料。</p>');
  return out+'<div class="grid2"><div>'+left+'</div><div>'+right+'</div></div>';
}

// ===== 4 購屋預算 =====
function budget(){
  var rm=R.rooms[roomIdx], mid=Math.round(rm.est*rm.ping), lo=Math.round(rm.estLo*rm.ping), hi=Math.round(rm.estHi*rm.ping);
  var parks=R.tx.filter(function(t){return t.parkP}).map(function(t){return t.parkP}).sort(function(a,b){return a-b});
  var pk=parks.length?parks[Math.floor(parks.length/2)]:null;
  var withPk=mid+(pk||0);
  var rows=[[2,8],[3,7]].map(function(r){var down=withPk*r[0]/10;return '<tr><td>頭期 '+r[0]+' 成／貸款 '+r[1]+' 成</td><td class="r"><b>'+n0(down)+'</b></td><td class="r">'+n0(withPk-down)+'</td></tr>'}).join("");
  var tot=head('STEP 2','預估購屋總價（'+rm.label+'，'+f1(rm.ping)+' 坪）','以'+estName+' × 本社區該格局坪數中位數估算。')+
    '<div class="big">'+n0(lo)+' – '+n0(hi)+' <small>萬（不含車位）</small></div>'+
    '<div class="lightnote">中位估算約 <b>'+n0(mid)+' 萬</b>'+(pk?'；本社區車位成交中位價約 <b>'+n0(pk)+' 萬</b>（'+parks.length+' 筆），含車位合計約 <b>'+n0(withPk)+' 萬</b>。':'；本社區實登資料中沒有拆分車位價格的成交。')+'</div>';
  var cash=head('STEP 3','自備款與貸款金額','以含車位的中位估算 '+n0(withPk)+' 萬計算；另需預留約總價 3–5% 的稅費、代書、仲介服務費與裝修預算。')+
    '<div class="scroll"><table class="t"><thead><tr><th>成數</th><th class="r">頭期款（萬）</th><th class="r">貸款（萬）</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<p style="margin:16px 0 0"><a class="btn gold" target="_blank" rel="noopener" href="'+D.loan+'?price='+withPk+'">用青安試算月付金 →</a></p>'+
    '<p class="muted" style="font-size:12.5px;margin:10px 0 0">月付金、利率、新青安額度上限與寬限期規則，統一在青安試算頁計算（會自動帶入總價）。</p>';
  var pick=head('STEP 1','選擇格局')+chips("chips4");
  return '<div class="grid2"><div>'+card(pick)+card(tot)+'</div><div>'+card(cash)+card(head('','想談實際物件？','實際開價、屋況、可議空間，每一戶都不一樣。')+'<a class="btn" href="'+"https://stanley-agent-booking.pages.dev/"+'">預約小鍾諮詢</a>')+'</div></div>';
}

// ===== 5 建案基本資料 =====
function basic(){
  var b=G.basic||{};
  var t=info([["投資興建",b.developer],["營造公司",b.contractor],["建築設計",b.architect],["建築規劃",b.structure],["總戶數",b.totalUnits],["格局規劃",b.floorPlan],["完工狀況",b.completion],["公設比",b.coverageRatio],["建蔽率",b.buildingCoverage],["座向",b.orientation],["車位規劃",b.parking],["管理費",b.managementFee],["物業管理",b.managementCompany]]);
  var src=info([["實登門牌",R.addrs.join("；")],["建物完工",R.built?R.built.replace("-"," 年 ")+" 月":"尚無（預售）"],["總樓層",R.floors?R.floors+" 層":""],["計算依據",R.n+" 筆"+basisTxt+"（"+ymd(R.from)+"–"+ymd(R.to)+"）"],["成交明細","中古 "+R.nResale+" 筆、預售 "+R.nPre+" 筆"],["資料截至",ymd(D.asof)]]);
  var out='<div class="grid2"><div>'+card(head('BASIC INFO','建案基本資料')+(t||'<p class="muted">尚未整理。</p>'))+'</div><div>'+
    (G.pros.length?card(head('HIGHLIGHTS','推薦重點')+ul(G.pros.slice(0,5))):'')+
    (G.facilities.length?card(head('FACILITIES','公共設施')+ul(G.facilities)):'')+
    card(head('DATA','成交資料怎麼對到這個社區','預售屋實價登錄有建案名稱，直接依名稱比對；中古屋實價登錄沒有社區名稱，以「同路段＋建物完工年月＋總樓層」辨識同一社區的各戶門牌。')+src)+'</div></div>';
  return out;
}

// ===== 分頁 =====
var PANES={overview:overview,market:market,life:life,budget:budget,basic:basic};
var cur="overview";
function render(){
  document.getElementById("panes").innerHTML='<div class="pane on">'+PANES[cur]()+'</div>';
  document.querySelectorAll(".tabs button").forEach(function(b){b.setAttribute("aria-selected",b.dataset.tab===cur)});
  document.querySelectorAll(".chips .chip").forEach(function(c){c.onclick=function(){roomIdx=+c.dataset.i;render()}});
  document.querySelectorAll("[data-go]").forEach(function(a){a.onclick=function(){go(a.dataset.go)}});
  if(cur==="market"){txShown=30;var s=document.getElementById("txf");s.value=txRoom;s.onchange=function(){txRoom=s.value;txShown=30;drawTx()};drawTx()}
}
function go(t,noScroll){if(!PANES[t])t="overview";cur=t;try{history.replaceState(null,"","#"+t)}catch(_){}render();if(!noScroll)window.scrollTo({top:0})}
document.querySelectorAll(".tabs button").forEach(function(b){b.onclick=function(){go(b.dataset.tab)}});
go((location.hash||"").slice(1),true);
})();
</script>
